name: Release PWA downloads

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Require the tag to match the package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error('Release tag must match package.json version');
          }
          NODE
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - name: Observe the live weather provider
        continue-on-error: true
        run: npm run check:weather
      - run: npm run release:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-downloads
          path: |
            artifacts/zaction-*-web.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-downloads
          path: artifacts
      - name: Publish versioned downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release already exists. Use a new version rather than replacing published downloads.\n' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          A runnable community PWA preview with public-pseudonym onboarding, a social feed, illustrated plan templates, comments/replies, interest signals, private saves, and going/maybe RSVPs. Members can plan a BBQ, potluck, games, walk, practical help, or civic idea. Templates are suggestions, not fabricated events or crowds.

          Bring & share lets a member offer one of a plan's fixed item entries, see the accepted public nickname, and release their own offer. Each entry has one accepted owner; duplicate labels are separate slots. Exact-claim releases prevent delayed work from removing a later reclaim. Pending claims do not reserve and pending releases do not free an item; conflicts require review before a deliberate retry. These public intentions do not affect ballots, RSVPs, personal progress, task completion, or verified attendance/delivery.

          Authors can prepare reviewed changes with a reason or explicitly cancel their listing. Accepted changes create a linked fresh proposal while the old terms, group outcome, and participation remain historical. Pending work, ballots, RSVPs, and offers never transfer as consent. Author/session checks and exact lifecycle tokens reject stale changes; stable retries cannot create duplicate successors. Planning again after cancellation creates a new ID rather than reactivating the old listing. Exact-owner/exact-claim releases remain available on the original inactive plan. No participants are automatically notified and no outside arrangements are cancelled.

          Cancellation confirmation now has one focus-return owner, preventing a later modal cleanup from restoring a stale trigger after durable success. Keyboard focus returns to stable plan management. Sanitized browser-failure annotations preserve the failed assertion and test location without dumping private state. Earlier preview downloads remain unchanged.

          Per-person cost estimates support planning without payments or bookings. Open-Meteo forecast lookup has explicit unavailable, stale, and out-of-range states; weather data is never invented. Live-provider access is separate from controlled integration tests and must be assessed from the actual release evidence.

          Schedule dates include their civil year without viewer-zone shifts; blank time notes say “Time to be agreed,” and raw notes remain unparsed beside a separate city reference zone. Weather is a daily city outlook, not an event-hour or exact-venue prediction. Current city/date/retry scope rejects mismatched or late responses; cached/offline/stale data retains its original check timestamp and uncertainty. Same-city/day cache data may be reused across linked plans without carrying consent or readiness. The existing backend cache/provider/schema are unchanged; ten backend fixtures and earlier provider notices are not new live evidence for this UI work.

          Proposal ballots remain separate from reactions and RSVPs. Eligible profiles each have equal voting weight; profile count is not proof of unique people. Personal progress and shared milestones do not increase that weight. Member content and sources remain public and unverified.

          Creation and shared submissions can be saved offline and remain pending until server acceptance. Existing room/browser data and legacy fixture history are preserved with additive migration. Private session credentials stay out of public state and release assets. Read the hosting instructions before upgrading or moving an existing room.

          Download the web ZIP and SHA256SUMS, verify and extract it, then run `node --use-env-proxy server.mjs` with Node.js 24.5+. Open the locally served site and use the browser's installation menu. Public hosting requires HTTPS and the same-origin preview API. The ZIP is a ready-to-host web build, not a native installer. Bricolage Grotesque is bundled offline with its OFL license; no font CDN is required.

          Validation: frozen dependency install, domain tests, production build, and Chromium browser flows completed for this tagged source in this release workflow. See the workflow run for the actual checks; counts from earlier preview releases are historical evidence only. The separate live-weather observation is nonblocking and can warn/fail while the workflow succeeds: inspect its actual notice or warning before claiming provider access.

          This public preview is not production membership or decentralized voting infrastructure. No on-device GPU/phone validation, Qwen inference, E2EE, payment custody, or licensed election-data integration is established by this release. Model downloads are not bundled. A downloadable build is not evidence of a reachable hosted deployment.
          NOTES
          printf '\nSource commit: `%s`\n' "$SOURCE_COMMIT" >> "$RUNNER_TEMP/release-notes.md"
          release_flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --verify-tag --title "Zaction $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${release_flags[@]}"
